    <title>Aviso de Conteúdo - Verificação de Idade</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(circle at 50% -20%, #2a0808 0%, #0a0a0a 60%);
        }

        .age-gate-container {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(231, 76, 60, 0.1);
            border: 2px solid #e74c3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
        }

        .icon-circle i {
            font-size: 2.2rem;
            color: #e74c3c;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: #a0a0a0;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-yes {
            background-color: #27ae60;
            color: #ffffff;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
        }

        .btn-yes:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(39, 174, 96, 0.3);
        }

        .btn-no {
            background-color: transparent;
            color: #666;
            border: 1px solid #333;
        }

        .btn-no:hover {
            background-color: #1a1a1a;
            color: #888;
        }

        .disclaimer {
            margin-top: 32px;
            font-size: 0.75rem;
            color: #555;
            line-height: 1.4;
        }
    </style>

<body>

    <div class="age-gate-container">
        <div class="icon-circle">
            <i class="fa-solid fa-lock"></i>
        </div>
        
        <h1>ACESSO RESTRITO</h1>
        <p>Esta página contém conteúdo exclusivo e não recomendado para menores. Você confirma ter <strong>18 anos ou mais</strong> para continuar?</p>

        <!-- Link protegido contra rastreadores básicos -->
        <button id="btnAcesso" class="btn btn-yes">
            <i class="fa-solid fa-check"></i> SIM, SOU MAIOR DE 18 ANOS
        </button>

        <!-- Botão não, joga pro Google -->
        <a href="https://www.google.com" class="btn btn-no">
            NÃO, SOU MENOR
        </a>

        <div class="disclaimer">
            Ao clicar em "Sim", você atesta que possui a idade legal exigida para acessar este tipo de conteúdo em sua região.
        </div>
    </div>

    <script>
        // Esta função constrói o link apenas quando o humano clica no botão,
        // evitando que os robôs (crawlers) das redes sociais encontrem o link escrito no código fonte.
        document.getElementById('btnAcesso').addEventListener('click', function() {
            var dest = ['v', 'i', 'p', '.', 'h', 't', 'm', 'l'];
            window.location.href = dest.join('');
        });
    </script>

</body>
</html>
